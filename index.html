<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brixx portal</title>

    <script>
        try {
            const storedTheme = localStorage.getItem('quote-generator-theme');
            document.documentElement.dataset.theme = storedTheme === 'brixx-light' ? 'brixx-light' : 'portal-dark';
        } catch {
            document.documentElement.dataset.theme = 'portal-dark';
        }
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
